<div class="metric"><div class="metric-label">Total sales</div><div class="metric-value" data-testid="total-sales">${{ "%.2f"|format(kpis.total_sales) }}</div></div>
<div class="metric"><div class="metric-label">Orders</div><div class="metric-value" data-testid="order-count">{{ kpis.order_count }}</div></div>
<div class="metric"><div class="metric-label">Unique customers</div><div class="metric-value" data-testid="unique-customers">{{ kpis.unique_customers }}</div></div>
<div class="metric"><div class="metric-label">Average order value</div><div class="metric-value" data-testid="average-order-value">${{ "%.2f"|format(kpis.average_order_value) }}</div></div>
